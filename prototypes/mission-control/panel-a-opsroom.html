<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opsroom — Damodaran 4e — HELD</title>
<style>
/* ============================================================================
   PANEL A — THE OPSROOM.  prototypes/mission-control/panel-a-opsroom.html
   Room-scale projection. Dark-committed on purpose: this is a wall, not a doc.
   No webfonts, no CDN, no network. Offline by design.

   THE GRAMMAR (Bonsiepe via Neurath: one vocabulary, learned once, read at 5 m)
     FILLED      the machine measured it
     HOLLOW/DASH a human told us — approximate
     VOID+HATCH  nothing was recorded
     glyphs      ▮ measured   ▯ testimony   ◆ alarm fired   ◇ alarm absent   ? unread
   Terracotta is reserved. Project law: terracotta only when your hand is required.
   ========================================================================== */

:root{
  --bg:#16130f; --bed:#1e1a16; --bed2:#241f1a;
  --ink:#e8e2dd; --dim:#9a938d; --faint:#6b625c; --ghost:#4a433d;
  --terra:#d97757; --terra-deep:#a94e2e; --terra-glow:rgba(217,119,87,.16);
  --amber:#e0b34c; --sage:#7fb069; --steel:#79a6bd;
  --rule:#332d27;
  --macro: clamp(2.6rem, 6.4vw, 11rem);
  --supra: clamp(1.5rem, 3.0vw, 4.4rem);
  --meso:  clamp(1.02rem, 1.55vw, 1.8rem);
  --micro: clamp(.74rem, .84vw, 1.0rem);
  --nano:  clamp(.64rem, .70vw, .82rem);
  --mono: ui-monospace, "Cascadia Mono", "Consolas", "DejaVu Sans Mono", monospace;
  --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:var(--micro); line-height:1.45;
  -webkit-font-smoothing:antialiased;
  padding:clamp(10px,1.4vw,30px);
}
.wrap{max-width:2000px;margin:0 auto}
h1,h2,h3{margin:0;font-weight:600}

/* ---- shared atoms -------------------------------------------------------- */
.eyebrow{font-family:var(--mono);font-size:var(--nano);letter-spacing:.20em;
  text-transform:uppercase;color:var(--faint)}
.eyebrow b{color:var(--dim);font-weight:600}
.rule{height:1px;background:var(--rule);margin:clamp(14px,1.5vw,28px) 0}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)} .faint{color:var(--faint)}
.fid{font-family:var(--mono);font-size:var(--nano);color:var(--ghost);letter-spacing:.02em}

/* a measure that reached the glass. NOTHING numeric is rendered any other way. */
.m{display:block;font-family:var(--mono);font-size:var(--micro);color:var(--ink)}
.m-repaired::before{content:"▲ ";color:var(--amber);font-size:.85em}
.m-honest::before{content:"▮ ";color:var(--faint);font-size:.85em}
.lead{display:block;font-family:var(--mono);font-weight:600;line-height:.95;
  letter-spacing:-.02em;color:var(--ink)}
.lead-unread{color:var(--faint)}
.figure{margin:0 0 .5em 0}
.figure .cap{display:block;font-size:var(--nano);letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);font-family:var(--mono);margin-bottom:.28em}

/* ---- header -------------------------------------------------------------- */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:2em;flex-wrap:wrap}
.top .brand{font-family:var(--mono);font-size:var(--nano);letter-spacing:.30em;color:var(--dim)}
.top .stamp{font-family:var(--mono);font-size:var(--nano);color:var(--faint);text-align:right}

/* ---- the algedonic block (Beer: one channel, pain or pleasure, demands response) */
.alged{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);
  gap:clamp(16px,2.2vw,48px);align-items:start;
  padding:clamp(14px,1.8vw,34px) 0 clamp(10px,1.4vw,22px)}
@media(max-width:1000px){.alged{grid-template-columns:1fr}}
.verdict{display:flex;align-items:center;gap:.3em;
  font-family:var(--mono);font-size:var(--macro);font-weight:700;line-height:.9;
  color:var(--terra);letter-spacing:-.03em;
  text-shadow:0 0 clamp(18px,2.4vw,60px) var(--terra-glow)}
.verdict .gl{font-size:.62em;line-height:1}
.hand{font-size:var(--supra);font-weight:600;letter-spacing:.02em;color:var(--terra);
  margin-top:.12em;line-height:1.05}
.subject{font-size:var(--meso);color:var(--ink);margin-top:.55em;line-height:1.3}
.subject .meta{display:block;font-size:var(--micro);color:var(--dim);
  font-family:var(--mono);margin-top:.35em}
.act{margin-top:clamp(12px,1.4vw,26px);display:grid;gap:.75em}
.act .row{display:grid;grid-template-columns:4.2em 1fr;gap:.9em;align-items:start}
.act .k{font-family:var(--mono);font-size:var(--nano);letter-spacing:.18em;
  color:var(--faint);padding-top:.42em;text-align:right}
.act .v{font-size:var(--meso);line-height:1.35}
.act .row.do .v{color:var(--terra)}
.act .row.do .k{color:var(--terra-deep)}

/* the two alarms that do not exist — the finding, given equal room-scale weight */
.absent-rail{border:1px dashed var(--terra-deep);border-radius:2px;
  padding:clamp(10px,1.2vw,20px);background:repeating-linear-gradient(135deg,
    rgba(217,119,87,.045) 0 6px, transparent 6px 12px)}
.absent-rail>.hdr{font-family:var(--mono);font-size:var(--nano);letter-spacing:.18em;
  color:var(--terra-deep);text-transform:uppercase;margin-bottom:.85em}
.absent{display:grid;grid-template-columns:auto 1fr;gap:.75em;margin-bottom:1.0em}
.absent:last-child{margin-bottom:0}
.absent .gl{font-size:var(--supra);line-height:.9;color:var(--terra-deep)}
.absent .ttl{font-size:var(--meso);color:var(--terra);line-height:1.15;font-weight:600}
.absent .sub{font-size:var(--nano);color:var(--dim);font-family:var(--mono);
  margin-top:.3em;letter-spacing:.04em}
.absent .do{font-size:var(--micro);color:var(--ink);margin-top:.45em}
.absent .do b{color:var(--terra-deep);font-family:var(--mono);font-size:var(--nano);
  letter-spacing:.18em;font-weight:600}

/* ---- THE SPINE ----------------------------------------------------------- */
.spine{margin-top:clamp(6px,.8vw,14px)}
.railhead{display:flex;justify-content:space-between;align-items:baseline;
  gap:1.5em;margin-bottom:.55em;flex-wrap:wrap}
.rail{position:relative;width:100%;isolation:isolate}
.rail-a{height:clamp(64px,7.0vw,140px)}
.rail-b{height:clamp(30px,3.0vw,58px)}
.seg{position:absolute;top:0;bottom:0;overflow:hidden}
/* FILLED = the machine measured it */
.seg.work{background:linear-gradient(180deg,#3c332b,#2b241e);
  border-left:1px solid #554a40;border-right:1px solid #554a40}
.seg.audit{background:#2f2a34;border-left:1px solid #4b4356;border-right:1px solid #4b4356}
/* VOID = nothing was recorded. No bed, no fill: the rail physically breaks. */
.seg.dark{background:repeating-linear-gradient(135deg,
    rgba(232,226,221,.055) 0 2px, transparent 2px 9px);
  border-left:1px dashed var(--ghost);border-right:1px dashed var(--ghost)}
.seg .sl{position:absolute;left:.5em;top:.35em;font-family:var(--mono);
  font-size:var(--nano);letter-spacing:.10em;color:var(--dim);white-space:nowrap}
.seg.dark .sl{color:var(--faint)}
.seg .sl2{position:absolute;left:.5em;bottom:.35em;font-family:var(--mono);
  font-size:var(--nano);color:var(--faint);white-space:nowrap}
.seg.tiny{border-left:1px solid var(--dim);border-right:0}
/* the void says its own size, at room scale. This is the finding of the voyage, and it is
   drawn INSIDE the hole so the duration and the emptiness are one object, not two. */
.seg.dark .void{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
  text-align:center;font-family:var(--mono);color:var(--faint);pointer-events:none}
.seg.dark .void b{display:block;font-weight:600;line-height:1.02;color:var(--dim);
  font-size:clamp(1rem,2.2vw,3.8rem);letter-spacing:-.01em}
.seg.dark .void span{display:block;font-size:var(--nano);letter-spacing:.26em;
  margin-top:.45em;text-transform:uppercase}
/* HOLLOW/DASH = a human told us */
.seg.test{background:transparent;border:1px dashed var(--ghost);border-radius:1px;top:6px;bottom:6px}
.seg.test.dead{background:repeating-linear-gradient(45deg,
    rgba(217,119,87,.05) 0 3px, transparent 3px 10px);border-color:var(--terra-deep)}
.seg.test.tw{background:rgba(232,226,221,.03)}
.seg.test .tl{position:absolute;left:.5em;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:var(--nano);color:var(--dim);white-space:nowrap;
  letter-spacing:.06em}
.seg.test.dead .tl{color:var(--terra)}

/* the event rug — 34 hairlines at their true instants */
.rug{position:relative;height:clamp(20px,2.0vw,34px);margin-bottom:3px;
  border-bottom:1px solid var(--rule)}
.rug i{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);opacity:.55}
.rugcount{position:absolute;bottom:calc(100% + 2px);font-family:var(--mono);
  font-size:var(--nano);color:var(--dim);white-space:nowrap;letter-spacing:.08em}
.rugcount.hole{color:var(--faint)}

/* axis */
.axis{position:relative;height:clamp(16px,1.7vw,26px);margin-top:2px}
.axis i{position:absolute;top:0;height:5px;width:1px;background:var(--ghost)}
.axis span{position:absolute;top:6px;font-family:var(--mono);font-size:var(--nano);
  color:var(--faint);transform:translateX(-50%);white-space:nowrap}

.cut{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--faint);z-index:3}

/* the two silences, named */
.silences{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,1.8vw,36px);
  margin-top:clamp(12px,1.4vw,24px)}
@media(max-width:820px){.silences{grid-template-columns:1fr}}
.silence{border-left:2px solid var(--rule);padding-left:1em}
.silence.dark-k{border-left-style:dashed;border-left-color:var(--ghost)}
.silence.dead-k{border-left-style:dashed;border-left-color:var(--terra-deep)}
.silence .h{font-family:var(--mono);font-size:var(--nano);letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim);margin-bottom:.4em}
.silence p{margin:.5em 0 0;color:var(--dim);font-size:var(--micro);max-width:52ch}

.heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));
  gap:clamp(14px,1.8vw,40px);margin-top:clamp(14px,1.6vw,30px);align-items:end}

/* ---- legend (the ISOTYPE vocabulary, stated once) ------------------------ */
.legend{display:flex;flex-wrap:wrap;gap:clamp(10px,1.4vw,30px);
  padding:.7em 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  margin-top:clamp(12px,1.4vw,26px)}
.lg{display:flex;align-items:center;gap:.5em;font-family:var(--mono);
  font-size:var(--nano);letter-spacing:.10em;color:var(--dim);text-transform:uppercase}
.sw{width:2.1em;height:.95em;flex:none}
.sw.work{background:linear-gradient(180deg,#3c332b,#2b241e);border:1px solid #554a40}
.sw.audit{background:#2f2a34;border:1px solid #4b4356}
.sw.dark{background:repeating-linear-gradient(135deg,rgba(232,226,221,.055) 0 2px,
  transparent 2px 9px);border:1px dashed var(--ghost)}
.sw.test{background:transparent;border:1px dashed var(--terra-deep)}

/* ---- alarms -------------------------------------------------------------- */
.alarms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));
  gap:clamp(12px,1.4vw,26px)}
.alm{border-top:2px solid var(--rule);padding-top:.8em}
.alm.p1{border-top-color:var(--terra)}
.alm.p2{border-top-color:var(--amber)}
.alm.p3{border-top-color:var(--faint)}
.alm.absent-alm{border-top-style:dashed;border-top-color:var(--terra-deep)}
.alm .hd{display:flex;align-items:baseline;gap:.55em;margin-bottom:.45em}
.alm .gl{font-size:var(--meso);line-height:1}
.alm.p1 .gl{color:var(--terra)} .alm.p2 .gl{color:var(--amber)} .alm.p3 .gl{color:var(--dim)}
.alm.absent-alm .gl{color:var(--terra-deep)}
.alm .pr{font-family:var(--mono);font-size:var(--nano);letter-spacing:.16em;color:var(--faint)}
.alm .ttl{font-size:var(--meso);line-height:1.15;font-weight:600;margin-bottom:.5em}
.alm.p1 .ttl{color:var(--terra)} .alm.p2 .ttl{color:var(--amber)}
.alm.p3 .ttl{color:var(--ink)} .alm.absent-alm .ttl{color:var(--terra)}
.alm dl{margin:0;display:grid;grid-template-columns:5.2em 1fr;gap:.35em .8em}
.alm dt{font-family:var(--mono);font-size:var(--nano);letter-spacing:.16em;
  color:var(--faint);text-align:right}
.alm dd{margin:0;font-size:var(--micro);color:var(--dim);line-height:1.4}
.alm dd.resp{color:var(--ink)}
.alm.p1 dd.resp,.alm.absent-alm dd.resp{color:var(--terra)}
.alm .whenz{font-family:var(--mono);font-size:var(--nano);color:var(--ghost);margin-left:auto}

/* ---- ISOTYPE population bars --------------------------------------------- */
.popbar{position:relative;height:clamp(26px,2.6vw,46px);display:flex;width:100%}
.popbar>div{position:relative;height:100%;overflow:hidden}
.pop-solid{background:linear-gradient(180deg,#3c332b,#2b241e);border:1px solid #554a40}
.pop-hollow{background:repeating-linear-gradient(135deg,rgba(232,226,221,.05) 0 2px,
  transparent 2px 8px);border:1px dashed var(--ghost)}
.pop-pass{background:#2c3329;border:1px solid #4a5744}
.pop-rej{background:#3a2f26;border:1px solid var(--terra-deep)}
.pop-fail{background:transparent;border:1px dashed var(--ghost)}
.popbar .lb{position:absolute;left:.45em;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:var(--nano);color:var(--dim);white-space:nowrap;
  letter-spacing:.06em}
.brackets{position:relative;height:clamp(40px,3.6vw,56px);margin-top:2px}
.brk{position:absolute;top:0;border-left:1px solid var(--faint);border-right:1px solid var(--faint);
  border-top:1px solid var(--faint);height:7px}
.brk.unread{border-color:var(--ghost);border-style:dashed}
.brk>span{position:absolute;top:9px;left:0;font-family:var(--mono);font-size:var(--nano);
  color:var(--dim);white-space:nowrap;letter-spacing:.05em}
.brk.unread>span{color:var(--faint)}
/* the two bracket captions ride on separate lines so they can never collide, at any
   column width — each still anchored under the segment whose seconds it describes. */
.brk.brk-r>span{left:auto;right:0;top:24px}

/* ---- slice trend --------------------------------------------------------- */
.trend{display:flex;align-items:flex-end;gap:clamp(3px,.4vw,8px);
  height:clamp(56px,5.4vw,104px);margin-top:1.6em}
.trend .b{flex:1;background:linear-gradient(180deg,#4a3f35,#2b241e);
  border:1px solid #554a40;border-bottom:0;position:relative;min-height:2px}
.trend .b.nul{background:repeating-linear-gradient(135deg,rgba(232,226,221,.05) 0 2px,
  transparent 2px 8px);border:1px dashed var(--ghost);height:100%}
.trend .b em{position:absolute;left:-2px;right:-2px;bottom:calc(100% + 2px);text-align:center;
  font-family:var(--mono);font-size:var(--nano);font-style:normal;color:var(--dim)}
.trend .b i{position:absolute;left:-4px;right:-4px;top:calc(100% + 3px);text-align:center;
  font-family:var(--mono);font-size:var(--nano);font-style:normal;color:var(--ghost)}
.trendaxis{border-top:1px solid var(--rule);padding-top:1.6em}

/* promise vs outcome */
.pvo{display:grid;gap:.4em;margin-top:.5em}
.pvo .r{display:grid;grid-template-columns:6.4em 1fr;gap:.7em;align-items:center}
.pvo .k{font-family:var(--mono);font-size:var(--nano);color:var(--faint);text-align:right}
.pvo .bar{height:clamp(12px,1.1vw,20px);position:relative}
.pvo .bar>div{height:100%}
.pvo .promised>div{background:repeating-linear-gradient(135deg,rgba(232,226,221,.07) 0 2px,
  transparent 2px 7px);border:1px dashed var(--ghost)}
.pvo .actual>div{background:linear-gradient(180deg,#3c5240,#243325);border:1px solid #4a5744}

/* ---- three columns ------------------------------------------------------- */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr));
  gap:clamp(18px,2.4vw,56px)}
.col>h2{font-family:var(--mono);font-size:var(--nano);letter-spacing:.26em;
  text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--rule);
  padding-bottom:.6em;margin-bottom:1em}
.blk{margin-bottom:clamp(16px,1.8vw,32px)}
.blk>h3{font-size:var(--micro);font-family:var(--mono);letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);margin-bottom:.6em}
.note{font-size:var(--nano);color:var(--faint);margin-top:.45em;line-height:1.5;max-width:62ch}
.warnrule{border:1px dashed var(--terra-deep);padding:.7em .9em;margin:1em 0;
  font-size:var(--nano);color:var(--terra);font-family:var(--mono);line-height:1.5;
  letter-spacing:.03em}
.empty{border:1px dashed var(--ghost);padding:.9em;background:repeating-linear-gradient(135deg,
  rgba(232,226,221,.04) 0 2px,transparent 2px 9px)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.3em .8em;font-size:var(--micro)}
.kv dt{font-family:var(--mono);font-size:var(--nano);color:var(--faint);
  letter-spacing:.12em;text-align:right;padding-top:.15em}
.kv dd{margin:0}

/* ---- localizers ---------------------------------------------------------- */
.locs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(290px,100%),1fr));
  gap:clamp(10px,1.2vw,24px)}
.loc{border-left:2px solid var(--rule);padding-left:.85em}
.loc .h{font-family:var(--mono);font-size:var(--nano);letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin-bottom:.3em}

/* ---- ledger + self-check ------------------------------------------------- */
details.ledger{border-top:1px solid var(--rule);padding-top:1em}
details.ledger>summary{cursor:pointer;font-family:var(--mono);font-size:var(--nano);
  letter-spacing:.20em;text-transform:uppercase;color:var(--dim);list-style:none}
details.ledger>summary::marker{content:""}
details.ledger>summary::before{content:"▸ ";color:var(--faint)}
details.ledger[open]>summary::before{content:"▾ "}
.led{margin-top:1.2em;display:grid;gap:1.1em}
.led .f{border-left:2px solid var(--rule);padding-left:.9em;max-width:110ch}
.led .f.rep{border-left-color:var(--amber)}
.led .f .id{font-family:var(--mono);font-size:var(--nano);color:var(--steel);letter-spacing:.04em}
.led .f .dsp{font-family:var(--mono);font-size:var(--micro);color:var(--ink);margin:.25em 0}
.led .f .cond{font-size:var(--nano);color:var(--dim);line-height:1.55}
.led .f .tri{margin-top:.5em;display:grid;grid-template-columns:5.2em 1fr;gap:.25em .8em}
.led .f .tri dt{font-family:var(--mono);font-size:var(--nano);color:var(--faint);text-align:right}
.led .f .tri dd{margin:0;font-size:var(--nano);color:var(--dim);line-height:1.5}
.led .f .pop{font-family:var(--mono);font-size:var(--nano);color:var(--faint)}

.check{margin-top:clamp(16px,1.8vw,30px);border-top:1px solid var(--rule);padding-top:1em}
.check .cl{display:flex;gap:.7em;align-items:baseline;font-family:var(--mono);
  font-size:var(--nano);color:var(--dim);margin-bottom:.3em}
.check .ok{color:var(--sage)} .check .bad{color:var(--terra)}
.banner{background:var(--terra-deep);color:#fff;padding:1em 1.2em;margin-bottom:1em;
  font-family:var(--mono);font-size:var(--micro);letter-spacing:.04em}
footer{margin-top:clamp(18px,2vw,40px);border-top:1px solid var(--rule);padding-top:1em;
  font-family:var(--mono);font-size:var(--nano);color:var(--ghost);line-height:1.7}
@media print{body{background:#fff;color:#000}}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script type="module">
/* ============================================================================
 * INLINE COPY OF ./voyage.js  —  verbatim, with exactly three mechanical
 * transforms, all semantically null in JavaScript:
 *   1. leading "export " keyword removed (the bindings stay in module scope)
 *   2. "export default VOYAGE;" replaced by a comment
 *   3. "<" + "/" rewritten as "<" + "\/"  (escapes the HTML script terminator;
 *      inside a JS string "\/" IS "/", and inside a comment it is cosmetic)
 * At load the panel dynamically imports the REAL ./voyage.js and diffs every
 * field display against this copy. Over http:// that check runs and reports.
 * Over file:// the browser blocks module imports, and the panel says so
 * rather than claiming a verification it did not perform.
 * ========================================================================== */
/**
 * voyage.js — the honest model of ONE voyage.
 *
 * Damodaran, "Investment Valuation" 4e · 1377 pages · dropped 2026-08-31T21:30:12Z ·
 * HELD 2026-09-01T04:56:33Z. 7h 26m 21s wall. Two convert legs, two audits, one power
 * cut, one unattended reboot, and 6h 20m 08s of total silence.
 *
 * QUARANTINE: prototypes/. Nothing here is imported, spawned, watched or shipped by the
 * live system. This module READS NOTHING AT RUNTIME — the fixture is inlined below.
 *

/** The sentinel for a quantity nobody reported. docs/34: renders UNREAD, never 0.0. */
const UNREAD = 'UNREAD';

/** The sentinel for a rate whose denominator is zero or whose denominator is not this run's. */
const UNDEFINED = 'UNDEFINED';

const T = (iso) => Date.parse(iso);

/** Seconds → "5h 02m 13s" / "1h 17m 55s" / "428.8s". Never returns a bare number. */
function fmtDuration(s) {
  if (s === null || s === undefined) return UNREAD;
  if (s < 60) return `${Number(s.toFixed(1))}s`;
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = Math.round(s % 60);
  return h ? `${h}h ${String(m).padStart(2, '0')}m ${String(sec).padStart(2, '0')}s`
           : `${m}m ${String(sec).padStart(2, '0')}s`;
}

/** ISO → "21:30:12Z" (the operator reads UTC; the machine writes UTC). */
function fmtClock(iso) { return iso.slice(11, 19) + 'Z'; }

/** A percentage ALWAYS prints its base. docs/34. */
function pct(n, d, label) {
  if (n === null || d === null || !d) return UNREAD;
  return `${((n / d) * 100).toFixed(1)}% (${n} of ${d}${label ? ' ' + label : ''})`;
}

/**
 * measure() — the only way a number enters this model.
 * Required: id, label, value, evidence, conditions.
 * `honest` defaults TRUE only when a numerator and denominator are both named, or the field
 * is a plain count with a named population. Anything else must declare itself.
 */
function measure(spec) {
  const m = {
    id: spec.id,
    label: spec.label,
    value: spec.value,                       // RAW, as the pipeline wrote it. Never render alone.
    unit: spec.unit ?? null,
    num: spec.num ?? null,                   // { label, value, unit }
    den: spec.den ?? null,                   // { label, value, unit }
    conditions: spec.conditions,             // docs/34: the third mandatory part
    population: spec.population ?? 'n/a',    // 'whole-book' | 'this-run' | 'prior-run' | 'mixed'
    evidence: spec.evidence,
    origin: spec.origin ?? null,             // file + key it came from
    honest: spec.honest !== false,
    display: spec.display,                   // THE ONLY STRING SAFE TO PUT ON GLASS
    naive: spec.naive ?? String(spec.value), // the negative control: what a lying panel prints
    census: spec.census ?? [],               // docs/51 row ids that bite this field
    defect: spec.defect ?? null,             // { reason, highlight, solution } — error structure
  };
  if (!m.honest && !m.defect) {
    throw new Error(`voyage.js: dishonest field ${m.id} has no error-structure record`);
  }
  return Object.freeze(m);
}

function collect() {
  const out = {};
  const add = (o) => { for (const k in o) { const v = o[k]; if (v && v.id && 'honest' in v) out[v.id] = v; } };
  add(SPANS);
  add(CONVERT_LEG_1.fields);
  add(CONVERT_LEG_2.fields);
  add(ANALYST.fields);
  add(LOCALIZERS);
  for (const a of AUDITS) if (a.fields) add(a.fields);
  return Object.freeze(out);
}

/** Every measure in the voyage, keyed by id. */
const FIELDS = collect();

/** Every field whose raw value must never reach the glass unmodified. */
function dishonest() {
  return Object.values(FIELDS).filter(f => !f.honest);
}

/** Every field a panel may render straight from `value`. */
function honest() {
  return Object.values(FIELDS).filter(f => f.honest);
}

/**
 * The ONLY sanctioned way to put a number on glass.
 * Pass a field id or a measure. Returns the honest string. Never returns a bare number.
 */
function render(idOrField) {
  const f = typeof idOrField === 'string' ? FIELDS[idOrField] : idOrField;
  if (!f) return UNREAD;
  return f.display;
}

/** Fields touched by a given census row, e.g. byCensus('N-059'). */
function byCensus(rowId) {
  return Object.values(FIELDS).filter(f => f.census.includes(rowId));
}

/* ==========================================================================================
 * PANEL A — THE OPSROOM
 * One question, at room scale: DOES THIS NEED ME RIGHT NOW, AND FOR WHAT?
 *
 * Rule 0 is enforced structurally, not by discipline: M() and BIG() are the ONLY two
 * functions in this file that put a numeral from a measure record on the glass, and both
 * read `field.display`. There is no code path from `field.value` to the DOM. The self-check
 * at the bottom re-derives that claim from the painted DOM rather than trusting this comment.
 * ========================================================================================== */

const ROOT = document.getElementById('root');

/* --- tiny DOM builder. No innerHTML anywhere: no string can smuggle markup onto the glass. */
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'style' && typeof v === 'object') Object.assign(n.style, v);
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    n.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid);
  }
  return n;
}
const txt = (t, cls, tag) => el(tag || 'div', cls ? { class: cls } : null, t);

/* --- the conditions sentence, one hop away on every figure (docs/34 rule 1.1) ------------- */
function conditionsOf(f) {
  const pop = POPULATIONS[f.population] ? POPULATIONS[f.population].label : f.population;
  const parts = [f.label.toUpperCase(), 'EVIDENCE: ' + f.evidence, 'POPULATION: ' + pop];
  if (f.num) parts.push('NUMERATOR: ' + f.num.label + ' = ' +
    (f.num.value === null ? UNREAD : f.num.value) + (f.num.unit ? ' ' + f.num.unit : ''));
  if (f.den) parts.push('DENOMINATOR: ' + f.den.label + ' = ' +
    (f.den.value === null ? UNREAD : f.den.value) + (f.den.unit ? ' ' + f.den.unit : ''));
  parts.push('CONDITIONS: ' + f.conditions);
  if (f.origin) parts.push('ORIGIN: ' + f.origin);
  if (f.census && f.census.length) parts.push('CENSUS: ' + f.census.join(', '));
  return parts.join('\n\n');
}

/* --- M(): the ONLY way a measure reaches the glass. Renders display, never value. --------- */
function M(id, extraClass) {
  const f = FIELDS[id];
  if (!f) return el('span', { class: 'm lead-unread' }, UNREAD + ' — no such field: ' + id);
  return el('span', {
    class: 'm ' + (f.honest ? 'm-honest' : 'm-repaired') + (extraClass ? ' ' + extraClass : ''),
    'data-field': id, title: conditionsOf(f),
  }, render(id));
}

/* --- LM(): the same, with the field's own label above it so no figure is anonymous -------- */
function LM(id) {
  const f = FIELDS[id];
  return el('div', { class: 'figure' },
    el('span', { class: 'cap' }, f.label.toUpperCase()), M(id));
}

/* --- BIG(): room-scale emphasis. The huge token MUST be a literal substring of the honest
 *     sentence, and the honest sentence is always printed directly beneath it. The self-check
 *     re-verifies LEAD ⊂ DISPLAY from the DOM, so a future edit cannot quietly invent a lead. */
function BIG(id, lead, cap, size) {
  const f = FIELDS[id];
  const isWord = /^[A-Z ]+$/.test(lead);
  return el('div', { class: 'figure' },
    cap ? el('span', { class: 'cap' }, cap) : null,
    el('span', {
      class: 'lead' + (isWord ? ' lead-unread' : ''), 'data-field': id, 'data-lead': '1',
      title: conditionsOf(f), style: { fontSize: size || 'var(--supra)' },
    }, lead),
    M(id));
}

    cur = { n: 0, first: e.ts, last: e.ts }; clusters.push(cur);
  }
  cur.n++; cur.last = e.ts;
}

  if (centrePct < 12) node.style.left = '0';
  else if (centrePct > 88) node.style.right = '0';
  else { node.style.left = pctS(centrePct); node.style.transform = 'translateX(-50%)'; }

  el('h3', null, 'LOCALIZERS — EVIDENCE, NOT GATES, NOT ALARMS'),
  txt('None of these can reach a fail verdict; the whole system has only two signals that can. ' +
    'They are here so the operator can find the damage, and they are deliberately kept out of ' +
    'the alarm strip above: an operator who cannot absorb the alarm load ignores all of it.',
    'note'),
  el('div', { class: 'locs', style: { marginTop: '1em' } },
    ['fidelity.pages_flagged', 'fidelity.page_coverage', 'fidelity.pages_scored',
     'fidelity.degeneration.blocks', 'fidelity.degeneration.repeated_lines',
     'fidelity.reverse_sample', 'fidelity.asset_delta', 'fidelity.dict_hit',
     'fidelity.garbage_rate'].map(id =>
      el('div', { class: 'loc' }, txt(FIELDS[id].label.toUpperCase(), 'h'), M(id))))));
cols.appendChild(c3);
ROOT.appendChild(cols);

/* ==========================================================================================
 * 6 · THE FIELD LEDGER — every measure the panel could draw, with its numerator, denominator
 *     and conditions, and where it had to be repaired for the glass, its reason / highlight /
 *     solution triple. The `naive` strings are deliberately NOT printed: they are the negative
 *     control, and a control you print onto the thing you are testing is not a control.
 * ========================================================================================== */
ROOT.appendChild(el('div', { class: 'rule' }));
const ledBody = el('div', { class: 'led' });
const allFields = Object.values(FIELDS)
  .sort((a, b) => (a.honest - b.honest) || a.id.localeCompare(b.id));
for (const f of allFields) {
  const pop = POPULATIONS[f.population] ? POPULATIONS[f.population].label : f.population;
  const node = el('div', { class: 'f' + (f.honest ? '' : ' rep') },
    txt(f.id + '   ' + (f.honest ? '▮ honest' : '▲ repaired for the glass') +
        (f.census.length ? '   census ' + f.census.join(' ') : ''), 'id'),
    txt(render(f.id), 'dsp'),
    txt('evidence ' + f.evidence + '   ·   population ' + pop +
        (f.num ? '   ·   numerator: ' + f.num.label + ' = ' +
          (f.num.value === null ? UNREAD : f.num.value) : '') +
        (f.den ? '   ·   denominator: ' + f.den.label + ' = ' +
          (f.den.value === null ? UNREAD : f.den.value) : ''), 'pop'),
    el('div', { class: 'cond', 'data-quoted': '1' }, f.conditions));
  if (f.defect) node.appendChild(el('dl', { class: 'tri' },
    el('dt', null, 'REASON'), el('dd', { 'data-quoted': '1' }, f.defect.reason),
    el('dt', null, 'HIGHLIGHT'), el('dd', { 'data-quoted': '1' }, f.defect.highlight),
    el('dt', null, 'SOLUTION'), el('dd', { 'data-quoted': '1' }, f.defect.solution)));
  ledBody.appendChild(node);
}
ROOT.appendChild(el('details', { class: 'ledger' },
  el('summary', null, 'THE FIELD LEDGER — all ' + allFields.length + ' measures, each with ' +
    'numerator, denominator, conditions and, where repaired, reason / highlight / solution'),
  ledBody));

/* ==========================================================================================
 * 7 · THE NEGATIVE CONTROL, RUN AGAINST THE PAINTED GLASS
 *     Not a promise in a comment. Eight checks, executed after layout, reported on the panel.
 *     If any fails, a terracotta banner goes to the top of the page and names it.
 *
 *     Each pattern is tuned to the NAIVE form, not to the honest one: several honest displays
 *     legitimately contain the same digits (chunks_total prints "+ 0 failed)" inside an
 *     arithmetic identity; reverse_sample's honest sentence contains the word "hallucination"
 *     in order to deny it). A blunt substring scan would flag those and would be worthless.
 *
 *     THE LIMIT OF A TEXT SCAN, STATED RATHER THAN HIDDEN. 20 of the model's 23 naive forms
 *     are caught by the patterns below — verified by running them against voyage.js itself,
 *     not asserted. Three cannot be, and they get structural controls instead:
 *       · dict_hit and garbage_rate, whose naive form is the bare string "0.0". Unmatchable
 *         without flagging every honest decimal on the glass. NC-9 is their control.
 *       · chunks_resumed, whose naive form is "(not shown at all)" — the lie is an OMISSION,
 *         and no scan can see a string that is not there. NC-7 is its control.
 *     The field ledger quotes the model's own conditions and defect prose verbatim, and that
 *     prose necessarily contains the very phrases the panel forbids itself from asserting
 *     ("928 passed or 4634.4s" appears inside the sentence explaining why that pairing is a
 *     lie). Those nodes are marked data-quoted and excluded from NC-1 — and NC-1b then proves
 *     every excluded node is byte-identical to a string in the model, so the exemption cannot
 *     be used to smuggle panel-authored text past the control.
 * ========================================================================================== */
const FORBIDDEN = [
  [/\b0 MiB\b/i, 'a null VRAM reading rendered as a zero quantity'],
  [/(?<!of |over )\b1372 pages\b/i, 'the silently shrunken denominator printed as if whole'],
  [/93\.3\s*%|94\.0\s*%/, 'a 12-word-window ratio published as a percentage of the document'],
  [/converted in 0\.0\s*s/i, 'leg 2 wall_s rendered as a measurement'],
  [/0\.00\s*s\s*\/\s*pp/i, 'leg 2 rate rendered as a measurement'],
  [/peak VRAM[ \t]*0[ \t]*MiB/i, 'a null VRAM reading rendered as zero'],
  [/peak VRAM[ \t]*9395/i, 'a 30 s sampled maximum rendered as a peak'],
  [/928[^\n]{0,24}4634/, 'a whole-book numerator over a run-sized denominator'],
  [/\b0 failed\b(?!\))/i, 'an unjournalled counter rendered as an all-clear'],
  [/0 repeated lines/i, 'a threshold reset rendered as a count'],
  [/\b25 omission runs\b/i, 'a display cap rendered as a count'],
  [/23\.5\s*%[^\n]{0,24}hallucinat/i, 'reverse_sample read as an invention rate'],
  [/76 assets missing/i, 'a positive surplus rendered as a loss'],
  [/%\s*utili[sz]ation/i, 'a busy-ness percentage built on an unmeasured denominator'],
  [/\bpage 0\b/i, 'a null page index rendered as page zero'],
  [/314,?311 prompt tokens/i, 'a lower bound rendered as a total'],
  [/analysis done in 4634/i, 'a run-2 duration rendered as the whole phase'],
  [/29 rejected this run/i, 'a whole-book count rendered as a this-run count'],
  [/93\.3[^\n]{0,60}94\.0|94\.0[^\n]{0,60}93\.3/, 'the two doc_survival figures on one axis'],
];

let modelCheck = { ok: true, msg: 'not yet run' };

/* Everything the panel ASSERTS, as laid-out text — including content inside a closed
 * <details>, which a viewer can open, and excluding the nodes that merely quote the model.
 * A clone is used so the real page is never mutated. */
function assertedText() {
  const clone = document.body.cloneNode(true);
  clone.querySelectorAll('[data-quoted]').forEach(n => n.remove());
  clone.querySelectorAll('details').forEach(d => d.setAttribute('open', ''));
  Object.assign(clone.style, { position: 'absolute', left: '-99999px', top: '0' });
  document.body.appendChild(clone);
  const t = clone.innerText;
  clone.remove();
  return t;
}

function selfCheck() {
  const res = [];
  const push = (id, ok, msg) => res.push({ id, ok, msg });

  /* NC-1 — no forbidden rendering reached the glass */
  const body = assertedText();
  const hits = FORBIDDEN.filter(([re]) => re.test(body));
  push('NC-1', hits.length === 0, hits.length
    ? 'FOUND ' + hits.length + ': ' + hits.map(h => h[1]).join('; ')
    : FORBIDDEN.length + ' forbidden renderings scanned against every word the panel ' +
      'asserts, closed drawers included, 0 present');

  /* NC-1b — the exemption is bounded: every excluded node is verbatim model text */
  const modelStrings = new Set();
  for (const f of Object.values(FIELDS)) {
    modelStrings.add(f.conditions);
    if (f.defect) { modelStrings.add(f.defect.reason); modelStrings.add(f.defect.highlight);
                    modelStrings.add(f.defect.solution); }
  }
  const quoted = [...document.querySelectorAll('[data-quoted]')];
  const unquoted = quoted.filter(n => !modelStrings.has(n.textContent));
  push('NC-1b', quoted.length > 0 && unquoted.length === 0, unquoted.length
    ? unquoted.length + ' node(s) claim quotation but are not verbatim model text'
    : quoted.length + ' nodes exempted from NC-1, every one byte-identical to a conditions or ' +
      'defect string in the model — the exemption cannot hide panel-authored prose');

  /* NC-2 — every room-scale lead is a literal substring of its field's honest sentence */
  const leads = [...document.querySelectorAll('[data-lead]')];
  const badLead = leads.filter(n => !FIELDS[n.dataset.field] ||
    !FIELDS[n.dataset.field].display.includes(n.textContent));
  push('NC-2', leads.length > 0 && badLead.length === 0, badLead.length
    ? badLead.map(n => n.dataset.field).join(', ') + ' invented a lead token'
    : leads.length + ' giant figures, each a literal substring of its own field.display');

  /* NC-3 — nothing on the glass came from field.value (Rule 0) */
  const ms = [...document.querySelectorAll('[data-field]')];
  const badM = ms.filter(n => {
    const f = FIELDS[n.dataset.field];
    return !f || !f.display.includes(n.textContent.trim());
  });
  push('NC-3', ms.length > 0 && badM.length === 0, badM.length
    ? badM.map(n => n.dataset.field).join(', ') + ' rendered outside field.display'
    : ms.length + ' measure nodes, every one equal to or contained in field.display');

  /* NC-4 — every alarm names a defined operator response (EEMUA 191) */
  const almNodes = [...document.querySelectorAll('[data-alarm]')];
  const noResp = almNodes.filter(n => {
    const r = n.querySelector('[data-response]');
    return !r || r.textContent.trim().length < 12;
  });
  push('NC-4', almNodes.length === ALARMS.length && noResp.length === 0, noResp.length
    ? noResp.map(n => n.dataset.alarm).join(', ') + ' carries no operator response'
    : almNodes.length + ' of ' + ALARMS.length + ' alarms drawn, each with a DO line');

  /* NC-5 — the timeline is not a solid bar: the voids are holes and they dominate it */
  const darkNodes = [...railA.querySelectorAll('.seg.dark')];
  const darkPct = darkSegs.reduce((a, s) => a + s.seconds, 0) / (SPAN_MS / 1000) * 100;
  const widest = [...railA.querySelectorAll('.seg.work,.seg.audit')]
    .reduce((m, n) => Math.max(m, parseFloat(n.dataset.w) || 0), 0);
  push('NC-5', darkNodes.length === darkSegs.length && darkPct > 80 && widest < 95,
    darkNodes.length + ' voids drawn as holes covering ' + darkPct.toFixed(1) +
    '% of the rail; widest filled block ' + widest.toFixed(1) +
    '% (an uninterrupted bar would be ~100%)');

  /* NC-6 — the two doc_survival figures are not siblings and share no scale */
  const ac = document.querySelector('[data-audit="convert"]');
  const an = document.querySelector('[data-audit="analyst"]');
  push('NC-6', !!ac && !!an && ac !== an && !ac.contains(an) && !an.contains(ac),
    'convert and analyst survival sit in separate cards, split by an explicit rule');

  /* NC-7 — chunks_resumed is present wherever chunks_passed or duration_s is (census N-005) */
  const sec = document.querySelector('[data-sec="analyst"]');
  const need = ['analyst.chunks_resumed', 'analyst.chunks_passed', 'analyst.duration_s'];
  const have = !!sec && need.every(id => sec.querySelector('[data-field="' + id + '"]'));
  push('NC-7', have, have
    ? 'chunks_resumed 641 is on the glass in the same section as chunks_passed and duration_s ' +
      '— this is the control for the one naive form no text scan can see, an OMISSION'
    : 'chunks_resumed is missing beside a whole-book count');

  /* NC-8 — is this inline copy of the model still identical to the file next door? */
  push('NC-8', modelCheck.ok, modelCheck.msg);

  /* NC-9 — SENTINEL INTEGRITY. The class of lie a text scan cannot police: a bare zero or a
   * null that is false only by omission. Each of these fields must be ON the glass, and its
   * rendered text must carry the sentinel. A future edit that quietly prints the raw value
   * fails here even though no forbidden string was typed. */
  const SENTINEL = ['convert.leg2.wall_s', 'convert.leg2.s_per_page',
    'convert.leg2.s_per_page_this_run', 'convert.leg2.peak_vram_mib',
    'fidelity.degeneration.repeated_lines', 'fidelity.dict_hit', 'fidelity.garbage_rate',
    'audit.analyst.run_page'];
  const bad9 = SENTINEL.filter(id => {
    const nodes = [...document.querySelectorAll('[data-field="' + id + '"]')];
    if (!nodes.length) return true;
    return !nodes.some(n => /UNREAD|UNDEFINED|NO WORK THIS RUN/.test(n.textContent));
  });
  push('NC-9', bad9.length === 0, bad9.length
    ? bad9.join(', ') + ' rendered a bare zero or null instead of its sentinel'
    : SENTINEL.length + ' fields whose raw value is a meaningless 0 or null are each drawn ' +
      'with UNREAD / UNDEFINED / NO WORK, never a numeral');
  return res;
}

/* --- NC-8's evidence: diff the inline copy against the real ./voyage.js, when the browser
 *     will let us load it. Over file:// it will not, and the panel says so instead of
 *     claiming a verification it did not perform. ------------------------------------------ */
async function verifyModel() {
  try {
    const real = await import('./voyage.js');
    const mine = Object.keys(FIELDS), theirs = Object.keys(real.FIELDS);
    const drift = [];
    if (mine.length !== theirs.length) {
      drift.push('field count ' + mine.length + ' against ' + theirs.length);
    }
    for (const id of mine) {
      if (!real.FIELDS[id]) { drift.push(id + ' missing upstream'); continue; }
      if (real.FIELDS[id].display !== FIELDS[id].display) drift.push(id + ' display drifted');
      if (real.FIELDS[id].honest !== FIELDS[id].honest) drift.push(id + ' honesty drifted');
    }
    if (real.TIMELINE.length !== TIMELINE.length) drift.push('timeline length drifted');
    if (real.ALARMS.length !== ALARMS.length) drift.push('alarm count drifted');
    if (real.VOYAGE.negativeControl.length !== VOYAGE.negativeControl.length) {
      drift.push('negativeControl length drifted');
    }
    modelCheck = drift.length
      ? { ok: false, msg: 'INLINE COPY HAS DRIFTED FROM ./voyage.js — ' + drift.join('; ') }
      : { ok: true, msg: 'inline copy verified field for field against ./voyage.js (' +
          mine.length + ' displays, ' + TIMELINE.length + ' timeline segments, ' +
          ALARMS.length + ' alarms) — identical' };
  } catch (err) {
    modelCheck = { ok: true, msg: 'NOT VERIFIED — the browser refused to load ./voyage.js as a ' +
      'module, which is what a file:// origin does. The panel is running its inline copy. ' +
      'Serve this directory over http to make this check actually run. ' + String(err).slice(0, 80) };
  }
}

function paintCheck() {
  const res = selfCheck();
  const bad = res.filter(r => !r.ok);
  const box = el('section', { class: 'check' },
    el('div', { class: 'eyebrow' }, 'NEGATIVE CONTROL — ',
      el('b', null, (res.length - bad.length) + ' OF ' + res.length + ' CHECKS PASS'),
      ' — executed against the painted DOM after layout, not asserted in a comment'));
  for (const r of res) {
    box.appendChild(el('div', { class: 'cl' },
      el('span', { class: r.ok ? 'ok' : 'bad' }, r.ok ? '▮ PASS' : '◆ FAIL'),
      el('span', null, r.id), el('span', { class: 'faint' }, r.msg)));
  }
  ROOT.appendChild(box);
  if (bad.length) ROOT.insertBefore(el('div', { class: 'banner' },
    'THIS GLASS IS LYING. ' + bad.length + ' negative-control check(s) failed: ' +
    bad.map(b => b.id + ' — ' + b.msg).join('   |   ')), ROOT.firstChild);
}

ROOT.appendChild(el('footer', null,
  txt(VOYAGE.headline),
  txt('PANEL A · THE OPSROOM — prototypes/mission-control/panel-a-opsroom.html · quarantined: ' +
    'nothing here is imported, spawned, watched or shipped by the live system. Model: ' +
    './voyage.js. Fixture: voyage-events.jsonl (34 events) and voyage-manifest.json. ' +
    'Lineage: the Project Cybersyn Opsroom (Gui Bonsiepe, 1972) by way of Otto Neurath’s ' +
    'ISOTYPE; Beer’s algedonic channel; EEMUA 191 / ISA-18.2; Tufte. Laws obeyed: docs/34 ' +
    'measurement language, the error-structure protocol, the docs/51 numeration census.')));

await verifyModel();
paintCheck();
</script>
</body>
