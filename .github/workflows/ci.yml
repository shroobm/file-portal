# CI for File Portal — see docs/08-roadmap.md (v3).
#
# python: ruff lint + format check for all three Linux subprojects, pytest for the allocator and
#         the converter (the converter writes the vault — it is the last code that should be
#         unverified).
# rust:   cargo fmt + clippy for the Tauri widget, run on windows-latest because that is the
#         widget's actual target and Tauri compiles there without extra system libraries
#         (Linux runners would need the whole webkit2gtk stack just to type-check).
#
# Trigger note (S67): this workflow used to fire only on push to `master` and on pull requests.
# All work happens by direct push to `feat/library-pipeline` and the project does not use PRs, so
# CI had not run on 203 consecutive commits — every green check in the ledger was a hand-run local
# check. Feature branches are listed explicitly below rather than using `branches: ['**']`, so a
# throwaway branch does not burn minutes.

name: CI

on:
  push:
    branches: [master, feat/library-pipeline]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r linux-receiver/requirements-dev.txt
          pip install -r linux-converter/requirements-dev.txt
      - name: Lint (linux-receiver)
        working-directory: linux-receiver
        run: |
          ruff check .
          ruff format --check .
      - name: Lint (linux-dashboard)
        working-directory: linux-dashboard
        run: |
          ruff check .
          ruff format --check .
      - name: Lint (linux-converter)
        working-directory: linux-converter
        run: |
          ruff check .
          ruff format --check .
      - name: Test (linux-receiver)
        working-directory: linux-receiver
        run: pytest tests/ -v
      - name: Test (linux-converter)
        working-directory: linux-converter
        run: pytest tests/ -v

  rust:
    # Scoped to master + PRs, NOT to feat/library-pipeline, deliberately (S67). Enabling CI on the
    # feature branch surfaced pre-existing drift the Rust half had accumulated while CI was silent:
    # `cargo fmt --check` fails across 8 files / 36 hunks in src/ (algedonic, assay, bench, line,
    # main, receipts, room, watcher). That is not a regression — it drifted because the desktop
    # lane's rebuild ritual runs `cargo clippy --all-targets -- -D warnings` and never `cargo fmt`,
    # so clippy stayed clean and formatting rotted.
    #
    # It is not fixed from the receiver lane because (a) those are desktop-owned files and the
    # desktop sometimes carries uncommitted work in its tree, so reformatting 8 files while it is
    # offline invites a conflict, and (b) clippy cannot be verified from Linux at all (Tauri needs
    # the webkit2gtk stack), so a green local check here would prove nothing about this job.
    #
    # To bring Rust onto the branch — desktop lane, in this order: run `cargo fmt` in
    # windows-widget/src-tauri, confirm `cargo fmt --check` and `cargo clippy --all-targets --
    # -D warnings` both pass, add `cargo fmt --check` to the rebuild ritual so it cannot rot again,
    # then add feat/library-pipeline to this `if:`. Consider pinning the toolchain the way ruff is
    # now pinned (SYM-019) — `@stable` moves, and a new clippy release is the same trap.
    # Tracked as SYM-020.
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-widget/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows-widget/src-tauri
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
