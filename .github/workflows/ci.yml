# CI for File Portal — see docs/08-roadmap.md (v3).
#
# python: ruff lint + format check for all three Linux subprojects, pytest for the allocator and
#         the converter (the converter writes the vault — it is the last code that should be
#         unverified). S108 (lane B2): the LIVE windows-converter lane joins, warn-only — ruff
#         check + its one CI-safe hermetic selftest; the inline comments name what is excluded
#         and why. Also warn-only: observability/acceptance.py, the governance suite (A29).
# rust:   cargo fmt + clippy for the Tauri widget, run on windows-latest because that is the
#         widget's actual target and Tauri compiles there without extra system libraries
#         (Linux runners would need the whole webkit2gtk stack just to type-check).
#
# Trigger note (S67): this workflow used to fire only on push to `master` and on pull requests.
# All work happens by direct push to `feat/library-pipeline` and the project does not use PRs, so
# CI had not run on 203 consecutive commits — every green check in the ledger was a hand-run local
# check. Feature branches are listed explicitly below rather than using `branches: ['**']`, so a
# throwaway branch does not burn minutes.

name: CI

on:
  push:
    branches: [master, feat/library-pipeline]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # S108 (lane B2): observability/acceptance.py §5/§6 probe HEAD~1..HEAD~39 for a real
          # exercising diff, and its stale-signature check returns False — a FAIL about the
          # clone, not the code — when no such ref exists. The default shallow clone (depth 1)
          # has none; 40 commits cover the probe's whole range.
          fetch-depth: 40
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r linux-receiver/requirements-dev.txt
          pip install -r linux-converter/requirements-dev.txt
          # S108 (lane B2): figure_coverage_selftest synthesises every fixture PDF with pymupdf.
          # Pinned directly, mirroring windows-converter/pyproject.toml's own pin, rather than
          # pip-installing that pyproject: its header declares it "a RECORD, not an installer",
          # and it carries no build-backend/packages config — one mirrored line is the smaller
          # diff and cannot fail a wheel build.
          pip install "pymupdf>=1.28,<2"
      - name: Lint (linux-receiver)
        working-directory: linux-receiver
        run: |
          ruff check .
          ruff format --check .
      - name: Lint (linux-dashboard)
        working-directory: linux-dashboard
        run: |
          ruff check .
          ruff format --check .
      - name: Lint (linux-converter)
        working-directory: linux-converter
        run: |
          ruff check .
          ruff format --check .
      # S108 (lane B2): the LIVE Windows lane joins CI, warn-only — the S108 standard makes
      # every new gate warn-only until observed. ruff has never run on this lane anywhere (the
      # desktop has no ruff installed), so the first-ever lint outcome is UNREAD until this
      # step reports. Same pinned ruff (==0.15.20) as the linux lanes — it arrives via their
      # requirements-dev installs above; `ruff check` only, no format gate on an unformatted lane.
      - name: Lint (windows-converter, warn-only)
        working-directory: windows-converter
        continue-on-error: true
        run: ruff check .
      - name: Test (linux-receiver)
        working-directory: linux-receiver
        run: pytest tests/ -v
      - name: Test (linux-converter)
        working-directory: linux-converter
        run: pytest tests/ -v
      # S108 (lane B2): the one windows-converter selftest that is safe here. It is hermetic —
      # every fixture PDF is synthesised with pymupdf in a temp dir; no corpus, no GPU, no live
      # dirs. Desktop run 2026-08-23 (marker-env, py3.12):
      # "==== figure_coverage selftest: 30/30 ====", exit 0. Warn-only per the S108 standard
      # until the ubuntu/py3.11/fresh-pymupdf triple is observed green.
      # EXCLUDED, deliberately:
      #   deferral_gate_selftest.py  — launches the REAL watch_and_convert.py as live
      #     subprocesses and drives watcher lifecycle (~40 s of real process orchestration).
      #   card_mutex_selftest.py     — exercises a Windows OS mutex (Local\file-portal-card)
      #     across real processes; no such object exists on a Linux runner.
      - name: Selftest (windows-converter figure_coverage, warn-only)
        working-directory: windows-converter
        continue-on-error: true
        run: python figure_coverage_selftest.py
      # S108 (lane B2), register A29's smallest slice: the governance acceptance suite runs
      # where a human will see it. stdlib+ast only — no installs. Desktop run 2026-08-23
      # (py3.12): "PASS — 41/41 checks", exit 0. Needs the deepened checkout above for its
      # §5/§6 --since probes. Warn-only per the S108 standard until observed on ubuntu/py3.11.
      - name: Governance acceptance (observability, warn-only)
        continue-on-error: true
        run: python observability/acceptance.py

  rust:
    # SYM-020 (found S67, cleared S68 2026-08-10): fmt drift across 8 files had accumulated while
    # CI was silent, because the rebuild ritual ran clippy and never `cargo fmt` — clippy stayed
    # clean while formatting rotted. Cleared in order: whitespace-only reformat commit, fmt+clippy+
    # tests proven locally, `cargo fmt --check` now LEADS the rebuild ritual (docs/19 §1) so the
    # rot cannot restart, then this job joined the branch. The original drift analysis and the
    # 5-step re-enable procedure live in this block's git history and SYMPTOM-INDEX.md.
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feat/library-pipeline' || github.event_name == 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-widget/src-tauri
    steps:
      - uses: actions/checkout@v4
      # Pinned like ruff (SYM-019): `@stable` moves, and a new clippy's lint set is the same trap.
      # 1.97.1 is the desktop's real rustc — the machine whose hand-run ritual this job mirrors.
      # S91: the dtolnay/rust-toolchain ACTION's own archive download 429'd from codeload on
      # two consecutive runs (2026-08-17, run 32042976659 — the job died at "Set up job",
      # before any repo step). The runner ships rustup, so the pinned toolchain is installed
      # directly and the third-party download dependency is gone.
      - name: Install Rust 1.97.1
        shell: pwsh
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
      # S91 second verse: with rust-toolchain inlined, the 429 moved to the NEXT third-party
      # archive (Swatinem/rust-cache — this run's log). The evidence pattern: codeload
      # throttles third-party action downloads while first-party ones (checkout/setup-python,
      # the python job's, green throughout) are served fine. So the cache uses the
      # first-party action with explicit paths. Key change = one cold build, then warm.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows-widget/src-tauri/target
          key: rust-1.97.1-${{ runner.os }}-${{ hashFiles('windows-widget/src-tauri/Cargo.lock') }}
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
