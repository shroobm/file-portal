[package]
name = "file-portal-widget"
version = "0.1.0"
description = "Drag-and-drop portal widgets that push files to a Linux box over Tailscale."
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# F-14 (S94): no cargo features — devtools stays available in `tauri dev` (debug default)
# and leaves RELEASE builds entirely; the feature was the only thing shipping it.
tauri = { version = "2", features = [] }
# SYM-033 (S94, signed docs/37 §3.2): a second launch fronts the first instead of becoming
# a second factory with its own watcher chain.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
# S37: Windows Job Objects — so a force-killed / crashed widget can't orphan its watcher.
# 0.61 is already in the lock (tauri pulls it), so this adds no new version.
# S157 E55 (B32 U02): + Win32_UI_WindowsAndMessaging for the one MessageBoxW a release build (no console) shows
# when the config cannot be read — the parse error used to die in a panic nobody could see.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
