<script type="module">
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const cap = () => document.getElementById("room").innerText;
async function renderWith(mod) {
  mod.initRoom({ setStatus: () => {}, dbg: () => {} });
  mod.setActiveSurface("room"); await wait(700); const room = cap();
  mod.setActiveSurface("wall"); await wait(700); const wall = cap();
  mod.setActiveSurface("off");  await wait(100);
  return { room, wall };
}
const pre  = await renderWith(await import("./room-pre-s74.js"));
const post = await renderWith(await import("./src/room.js"));
// every position where the two strings differ, with context — the Room header carries a live
// clock (room.js:513), so a legitimate audit shows diffs ONLY inside that 8-char span
function diffs(a, b) {
  const out = [];
  for (let i = 0; i < Math.max(a.length, b.length); i++)
    if (a[i] !== b[i]) out.push({ i, pre: a.slice(i - 6, i + 8), post: b.slice(i - 6, i + 8) });
  return out.slice(0, 12);
}
window.__AUDIT = {
  roomEqual: pre.room === post.room,
  wallEqual: pre.wall === post.wall,
  preRoom: pre.room.length, postRoom: post.room.length,
  preWall: pre.wall.length, postWall: post.wall.length,
  roomDiffs: diffs(pre.room, post.room),
  wallDiffs: diffs(pre.wall, post.wall),
  errs: window.__ERRS,
